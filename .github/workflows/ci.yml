name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. ML Microservice Job (Python 3.11 + Pytest)
  # ==========================================
  ml:
    name: ML Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ml/requirements.txt
      
      - name: Install system dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ML tests with pytest
        run: |
          python -m pytest tests/ -v
        env:
          ENVIRONMENT: test
          ML_INTERNAL_TOKEN: "dev-secret-internal-token-change-in-production"

  # ==========================================
  # 2. Backend Job (Node 20 + MongoDB + Prisma)
  # ==========================================
  backend:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
      
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: Run Backend Evaluation Tests
        run: npm test
        env:
          NODE_ENV: test
          MONGODB_URI: "mongodb://127.0.0.1:27017/anumati_test"
          JWT_SECRET: "test_secret_for_ci_pipeline"
          ML_INTERNAL_TOKEN: "dev-secret-internal-token-change-in-production"

  # ==========================================
  # 3. Frontend Job (Node 24 + Webpack Build)
  # ==========================================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build

  # ==========================================
  # 4. Docker Build & Compose Validation Job
  # ==========================================
  docker:
    name: Docker Build & Compose Validation
    runs-on: ubuntu-latest
    needs: [ml, backend, frontend]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Validate docker-compose syntax & configs
        run: docker compose config
        env:
          ML_INTERNAL_TOKEN: "ci_pipeline_production_ml_secret_token_2026"
          JWT_SECRET: "ci_pipeline_production_jwt_secret_token_2026"

      - name: Build all Docker service images
        run: docker compose build --parallel

      - name: Spin up multi-container stack & check health
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps
        env:
          ML_INTERNAL_TOKEN: "ci_pipeline_production_ml_secret_token_2026"
          JWT_SECRET: "ci_pipeline_production_jwt_secret_token_2026"

      - name: Teardown Docker stack
        if: always()
        run: docker compose down -v

        run: docker compose down -v